<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <title>StudyPod - Tutor</title>
    <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/chat-style.css">
    <link rel="stylesheet" type="text/css" href="assets/css/chat-studypod.css">
    <link rel="stylesheet" type="text/css" href="assets/css/chat-leftnav.css">
</head>

<body>
    <div class="main-wrapper">
        <div class="header">
            <div class="header-left">
                <a href="javascript:void(0)" class="logo"><img src="./assets/img/studyPod_logo.png" width="35"
                        height="35" alt=""> <span>StudyPod</span></a>
            </div>
            <a id="toggle_btn" href="javascript:void(0);" style="display:none;"><i class="fa fa-bars"></i></a>
            <a id="mobile_btn" class="mobile_btn " href="#sidebar" aria-label="Menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </a>
            <ul class="nav user-menu float-right">
                <li class="nav-item"><a href="javascript:void(0)" class="nav-link" id="resetDemoBtn"
                        title="Reset demo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg></a></li>
                <li class="nav-item dropdown has-arrow">
                    <a href="#" class="dropdown-toggle nav-link user-link" data-toggle="dropdown"><span
                            class="user-img"><img class="rounded-circle" src="https://i.pravatar.cc/40?img=32"
                                width="40"><span class="status online"></span></span><span>Tutor</span></a>
                    <div class="dropdown-menu"><a class="dropdown-item" href="chat-student.html">Switch to Student</a>
                    </div>
                </li>
            </ul>
        </div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-inner slimscroll" style="height:100%;">
                <div id="studyPodLeftNavRoot" style="height:100%; display:flex; flex-direction:column;"></div>
            </div>
        </div>
        <div class="page-wrapper" style="padding-top:60px;">
            <div class="content" style="padding:0;">
                <div class="studypod-chat-row" style="display:flex; height:calc(100vh - 60px);">
                    <div class="sp-chat-window"
                        style="flex:1; background:#fafafa; display:flex; flex-direction:column;">
                        <div class="fixed-header" id="chatHeaderRoot"
                            style="background:#fff; border-bottom:1px solid #eaeaea; padding:10px 15px; display:flex; align-items:center;">
                            <div class="navbar" style="padding:0; flex:1;">
                                <div class="user-details mr-auto d-flex align-items-center">
                                    <div class="user-img m-r-10"><a href="javascript:void(0)"><img id="chatHeaderImg"
                                                src="https://i.pravatar.cc/40" class="w-40 rounded-circle"><span
                                                id="chatHeaderDot" class="status online"
                                                style="background:#55ce63;"></span></a></div>
                                    <div class="user-info"><a href="javascript:void(0)"><span class="font-bold"
                                                id="chatHeaderName">Select a conversation</span></a><span
                                            class="last-seen" id="chatHeaderStatus"></span></div>
                                </div>
                            </div>
                            <button id="rightCollapseToggle" class="sp-right-collapse-toggle" title="Hide details"
                                aria-label="Toggle right panel">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="15" y1="3" x2="15" y2="21"></line>
                                    <polyline points="8 9 12 12 8 15"></polyline>
                                </svg>
                            </button>
                            <button id="mobile_right_btn" aria-label="Details" style="display:none;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="9" y1="3" x2="9" y2="21"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="chats-container" id="chatMessagesRoot"
                            style="flex:1; overflow-y:auto; padding:15px;">
                            <div class="chat-content-wrap">
                                <div class="chat-wrap-inner">
                                    <div class="chat-box">
                                        <div class="chats"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="sp-message-input"
                            style="border-top:1px solid #eaeaea; background:#fff; padding:10px; display:flex; gap:10px;">
                            <textarea id="messageTextarea" class="form-control" placeholder="Type a message..." rows="1"
                                style="flex:1; border-radius:20px;"></textarea>
                            <button id="sendMessageBtn" class="btn btn-primary"
                                style="border-radius:50%; width:44px; height:44px;" disabled><svg width="18" height="18"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg></button>
                        </div>
                    </div>
                    <div class="sp-profile" id="rightPanelRoot"
                        style="width:280px; background:#fff; border-left:1px solid #eaeaea; overflow-y:auto;">
                        <div class="p-3 text-center border-bottom">
                            <img id="rightProfileImg" src="https://i.pravatar.cc/80" class="rounded-circle mb-2"
                                style="width:72px;height:72px;">
                            <h5 id="rightProfileName" style="margin:0; font-size:16px;">No selection</h5>
                            <p id="rightProfileSubj" class="text-muted" style="font-size:12px; margin:0;"></p>
                        </div>
                        <div class="p-3">
                            <h6 style="font-size:13px; font-weight:600;">Details</h6>
                            <div id="rightProfileDetails"></div>
                        </div>
                        <div class="p-3">
                            <h6 style="font-size:13px; font-weight:600;">Stats</h6>
                            <div id="rightProfileStats"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="offerModal" tabindex="-1" role="dialog">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="offerModalLabel"><svg width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                            </svg> Create custom offer</h5><button type="button" class="close"
                            data-dismiss="modal"><span>&times;</span></button>
                    </div>
                    <form id="offerForm">
                        <div class="modal-body">
                            <div class="form-group"><label>Course title</label><input type="text" name="courseTitle"
                                    class="form-control"><small class="text-danger error"
                                    data-error="courseTitle"></small></div>
                            <div class="row">
                                <div class="col-6 form-group"><label>Currency</label><select name="currency"
                                        class="form-control">
                                        <option value="NGN">NGN (₦)</option>
                                        <option value="USD">USD ($)</option>
                                        <option value="GHS">GHS (GH₵)</option>
                                    </select></div>
                                <div class="col-6 form-group"><label>Amount</label><input type="number" name="amount"
                                        class="form-control"><small id="currencyPreview" class="text-muted"></small>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6 form-group"><label>Start date</label><input type="date"
                                        name="startDate" class="form-control"></div>
                                <div class="col-6 form-group"><label>End date</label><input type="date" name="endDate"
                                        class="form-control"></div>
                            </div>
                            <div class="form-group"><label>Time</label><input type="text" name="time"
                                    class="form-control"></div>
                            <div class="form-group"><label>Summary</label><textarea name="summary" class="form-control"
                                    rows="3"></textarea></div>
                        </div>
                        <div class="modal-footer"><button type="button" class="btn btn-light"
                                data-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary"
                                id="offerSubmitBtn">Create</button></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="sidebar-overlay" data-reff=""></div>
    <div class="sp-right-overlay" id="spRightOverlay"></div>
    <script src="assets/js/jquery-3.2.1.min.js"></script>
    <script src="assets/js/popper.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/jquery.slimscroll.js"></script>
    <script src="assets/js/app.js"></script>
    <script type="module">
        import { initApp } from './assets/js/studypod/main.js';
        initApp('tutor');
    </script>
</body>

</html>
